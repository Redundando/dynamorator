[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamorator"
version = "0.1.3"
description = "Lightweight DynamoDB JSON storage with automatic TTL support"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
license-files = ["LICENSE"]
authors = [
    {name = "Arved Klöhn"}
]
keywords = ["dynamodb", "aws", "json", "storage", "cache", "ttl", "database"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Database"
]
dependencies = [
    "boto3",
    "logorator>=2.0.0"
]

[project.urls]
Homepage = "https://github.com/Redundando/dynamorator"
Repository = "https://github.com/Redundando/dynamorator"
Issues = "https://github.com/Redundando/dynamorator/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["dynamorator*"]
